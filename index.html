<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- Logo y Favicon Oficial (Sin Fondo / Transparente) -->
    <link rel="icon" type="image/png" href="/favicon.png?v=3" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Responsive y Safe Areas para iPhone Notch y Dynamic Island -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <!-- PWA y Configuración Nativa iOS Safari -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vive y Canta" />
    <meta name="application-name" content="Vive y Canta" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#111111" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111111" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F0E6" />

    <!-- SEO -->
    <title>
      Vive y Canta | Plataforma Oficial del Coro
    </title>

    <meta
      name="description"
      content="Plataforma oficial del Coro de Alabanza Vive y Canta. Gestión de integrantes, finanzas, actividades, carnet digital y administración coral."
    />

    <meta
      name="keywords"
      content="Coro Vive y Canta, Coro de Alabanza, Vive y Canta, Parroquia El Triunfo, Choluteca, Coro Juvenil, plataforma oficial"
    />

    <meta
      name="author"
      content="Coro Vive y Canta"
    />

    <!-- Open Graph (Facebook / WhatsApp) -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Vive y Canta | Plataforma Oficial del Coro"
    />

    <meta
      property="og:description"
      content="Sistema oficial del Coro de Alabanza Vive y Canta. Gestiona integrantes, actividades, finanzas y mucho más."
    />

    <meta
      property="og:image"
      content="https://viveycanta.com/logo.png"
    />

    <meta
      property="og:url"
      content="https://viveycanta.com"
    />

    <!-- Twitter -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Vive y Canta | Plataforma Oficial del Coro"
    />

    <meta
      name="twitter:description"
      content="Sistema oficial del Coro Vive y Canta."
    />

    <meta
      name="twitter:image"
      content="https://viveycanta.com/logo.png"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
